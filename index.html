<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Крокодильчик</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="game">
  <header class="topbar">
    <div class="logo"><span>●</span> КРОКОДИЛЬЧИК</div>
    <div class="counter">ВОПРОС <b id="roundNumber">1</b> / 12</div>
    <button class="sound" id="audioButton" aria-label="Настройки музыки и звуков" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10H4Z"/><path class="sound-wave" d="M16 9c1.5 1.6 1.5 4.4 0 6M19 6c3.3 3.2 3.3 8.8 0 12"/></svg></button>
  </header>

  <aside class="audio-panel" id="audioPanel" hidden>
    <div class="audio-head"><div><small>АУДИО</small><strong>Звук игры</strong></div><button id="closeAudio" aria-label="Закрыть настройки">×</button></div>
    <div class="audio-channel">
      <div class="channel-title"><span class="channel-icon"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg></span><div><b>Музыка</b><small>Фоновый трек</small></div><button class="channel-toggle" id="musicToggle" aria-pressed="true">ВКЛ</button></div>
      <label for="musicVolume"><span>Громкость</span><output id="musicOutput">55%</output><input id="musicVolume" type="range" min="0" max="100" value="55"></label>
    </div>
    <div class="audio-channel">
      <div class="channel-title"><span class="channel-icon"><svg viewBox="0 0 24 24"><path d="M5 8h3l4-3v14l-4-3H5zM16 9l4 6M20 9l-4 6"/></svg></span><div><b>Звуки</b><small>Зубы и эффекты</small></div><button class="channel-toggle" id="effectsToggle" aria-pressed="true">ВКЛ</button></div>
      <label for="effectsVolume"><span>Громкость</span><output id="effectsOutput">70%</output><input id="effectsVolume" type="range" min="0" max="100" value="70"></label>
    </div>
  </aside>

  <section class="scene" id="stage">
    <div class="croc-wrap" id="crocWrap">
      <img class="croc-image open-frame" src="assets/crocodile-open.png" alt="Глянцевый игрушечный крокодил с открытой пастью">
      <img class="croc-image closed-frame" src="assets/crocodile-closed.png" alt="Крокодил с закрытой пастью">
      <div class="idle-effects" id="idleEffects" aria-hidden="true">
        <span class="eyelid eyelid-left"></span>
        <span class="eyelid eyelid-right"></span>
        <span class="nostril-steam steam-left"><i></i><i></i><i></i></span>
        <span class="nostril-steam steam-right"><i></i><i></i><i></i></span>
      </div>
      <div class="teeth-layer teeth-disabled" id="teeth"></div>
      <div class="flash" aria-hidden="true"></div>
    </div>
  </section>

  <footer class="game-footer">
    <div class="instruction" id="instruction">Нажми «ВОПРОС», чтобы начать</div>
    <button class="question-button" id="questionButton">ВОПРОС</button>
  </footer>
</main>

<div class="modal" id="questionModal" aria-hidden="true">
  <div class="card question-card">
    <div class="question-icon">?</div>
    <p class="eyebrow">ВОПРОС <span id="modalRound">1</span> / 12</p>
    <h1 id="questionText">Назови три вещи, которые ты обычно делаешь утром.</h1>
    <p class="hint">Ответь вслух, затем нажми кнопку.</p>
    <button id="continueButton">Я ОТВЕТИЛ</button>
  </div>
</div>

<div class="modal gameover" id="gameOverModal" aria-hidden="true">
  <div class="card gameover-card">
    <p class="eyebrow">ОПАСНЫЙ ЗУБ!</p>
    <h1>GAME OVER!</h1>
    <p>Крокодильчик захлопнул пасть</p>
    <button id="playAgainButton">↻ &nbsp; ИГРАТЬ СНОВА</button>
  </div>
</div>
<audio id="backgroundMusic" src="audio/background-music.mp3" loop preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
